# Gold Intelligence (XAUUSD) — n8n + PostgreSQL, 24/7.
#
#   cp .env.example .env        # then set GI_PG_PASSWORD, N8N_ENCRYPTION_KEY and the secrets
#   docker compose up -d
#   open http://localhost:5678 and create the n8n owner account (first visit only)
#
# Secrets come from .env through the container environment only. They are never
# written into workflow JSON, images or logs. See DEPLOYMENT.md.
name: gold-intelligence

x-n8n-env: &n8n-env
  # n8n's own database (same PostgreSQL server, separate database)
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${N8N_DB_DATABASE:-n8n}
  DB_POSTGRESDB_USER: ${GI_PG_USER:-gold_intel}
  DB_POSTGRESDB_PASSWORD: ${GI_PG_PASSWORD:?set GI_PG_PASSWORD in .env}
  # Gold-intelligence data store, as seen from inside the compose network. Passed explicitly (not only
  # through env_file) because the bootstrap builds the n8n Postgres credential from these values.
  GI_PG_HOST: postgres
  GI_PG_PORT: "5432"
  GI_PG_DATABASE: ${GI_PG_DATABASE:-gold_intel}
  GI_PG_USER: ${GI_PG_USER:-gold_intel}
  GI_PG_PASSWORD: ${GI_PG_PASSWORD:?set GI_PG_PASSWORD in .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env (keep it stable)}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Africa/Casablanca}
  TZ: ${TZ:-Africa/Casablanca}
  N8N_PORT: "5678"
  # IPv4 bind: n8n's default "::" crash-loops on hosts without IPv6. The port is published on 127.0.0.1 only.
  N8N_LISTEN_ADDRESS: ${N8N_LISTEN_ADDRESS:-0.0.0.0}
  N8N_HOST: ${N8N_HOST:-localhost}
  N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
  N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
  N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
  # Code nodes read GI_* settings and secrets from the environment (never from workflow JSON).
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  N8N_RUNNERS_ENABLED: "true"
  N8N_RUNNERS_TASK_TIMEOUT: "300"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"
  EXECUTIONS_DATA_PRUNE_MAX_COUNT: "20000"
  N8N_LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GI_PG_USER:-gold_intel}
      POSTGRES_PASSWORD: ${GI_PG_PASSWORD:?set GI_PG_PASSWORD in .env}
      POSTGRES_DB: ${GI_PG_DATABASE:-gold_intel}
      N8N_DB_DATABASE: ${N8N_DB_DATABASE:-n8n}
      TZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
      # First start only (empty volume): n8n database, schema, sources, historical seed.
      - ./deploy/postgres-init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./sql:/gi/sql:ro
      - ./seed:/gi/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    # Not published to the host by default. Uncomment for local inspection only:
    # ports: ["127.0.0.1:5433:5432"]

  # One-shot: imports the Postgres credential and the workflows into n8n on the FIRST boot,
  # then activates the scheduled workflows. Later boots are no-ops, so edits made in the n8n UI
  # (the source of truth) are never overwritten. The workflow JSON files are backups.
  n8n-bootstrap:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:1.117.2}
    restart: "no"
    env_file: .env
    environment: *n8n-env
    entrypoint: ["/bin/sh", "/gi/deploy/n8n-bootstrap.sh"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/gi/workflows:ro
      - ./deploy/n8n-bootstrap.sh:/gi/deploy/n8n-bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:1.117.2}
    restart: unless-stopped
    env_file: .env
    environment: *n8n-env
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      n8n-bootstrap:
        condition: service_completed_successfully

volumes:
  pg_data:
  n8n_data:
